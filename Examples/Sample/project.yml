# Source for Sample.xcodeproj. Regenerate with `xcodegen generate` in this directory.
name: Sample
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
configFiles:
  Debug: Configuration/SampleCode.xcconfig
  Release: Configuration/SampleCode.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Sample:
    type: application
    platform: iOS
    sources: [Sample]
    info:
      path: Sample/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.argmaxinc.deviceloop.sample
            CFBundleURLSchemes: [deviceloop-sample]
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.argmaxinc.deviceloop.sample$(SAMPLE_CODE_DISAMBIGUATOR)
        INFOPLIST_KEY_CFBundleDisplayName: Sample
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
