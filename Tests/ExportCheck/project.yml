# Source for ExportCheck.xcodeproj. Regenerate with `xcodegen generate` in this folder.
name: ExportCheck
options:
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: false
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  ExportCheckHost:
    type: application
    platform: iOS
    sources: [../../Runner/Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.argmaxinc.deviceloop.exportcheck
        INFOPLIST_KEY_CFBundleDisplayName: ExportCheck
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  ExportCheckUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ExportCheckHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.argmaxinc.deviceloop.exportcheck.uitests
        TEST_TARGET_NAME: ExportCheckHost
schemes:
  ExportCheck:
    build:
      targets:
        ExportCheckUITests: [test]
    test:
      targets: [ExportCheckUITests]
